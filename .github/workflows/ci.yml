# CI gate: typecheck + lint + unit on every PR and every push to main.
# No e2e here (that is the local PR gate; it needs `vercel dev` and env vars).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20: @supabase/realtime-js needs the native WebSocket
      # that only landed in Node 22, and `npm test` imports src/lib/supabase.ts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
